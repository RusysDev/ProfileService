<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Kompiuterio limitai</title>
	<link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
	<nav>
		<a href="/admin">Laikas</a>
		<a href="/admin/limits" style="text-decoration:underline;">Limitai</a>
		<a href="/admin/message">Žinutė</a>
	</nav>

	<div id="schedules"></div>
	<button id="saveBtn">Saugoti</button>

	<script>
		let globalData = {};
		const validDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

		fetch('/admin/config')
			.then(response => response.json())
			.then(data => {
				globalData = data;
				const container = document.getElementById('schedules');

				for (const [username, configObj] of Object.entries(data)) {
					let section = `<h3>${username}</h3>`;
					let generalInputs = '';
					let tableRows = '';

					for (const [key, val] of Object.entries(configObj)) {
						if (validDays.includes(key) && typeof val === 'object' && val !== null) {
							const startTime = val.start ? val.start.substring(0, 5) : '';
							const endTime = val.end ? val.end.substring(0, 5) : '';
							const dayDisplay = key.charAt(0).toUpperCase() + key.slice(1);

							tableRows += `<tr><td><strong>${dayDisplay}</strong></td>
											  <td><input type="time" value="${startTime}" data-user="${username}" data-day="${key}" data-field="start"></td>
											  <td><input type="time" value="${endTime}" data-user="${username}" data-day="${key}" data-field="end"></td>
											  <td><input type="number" value="${val.time ?? ''}" data-user="${username}" data-day="${key}" data-field="time"></td></tr>`;
						} else {
							generalInputs += `<div style="margin-bottom: 8px; max-width: 400px;">
													<label><strong>${key}:</strong></label><br>
													<input type="text" value="${val ?? ''}" data-user="${username}" data-prop="${key}" style="width: 100%; padding: 4px;">
												  </div>`;
						}
					}

					section += generalInputs;

					if (tableRows) {
						section += `<div class="table-responsive"><table border="1" cellpadding="5"><tr><th></th><th>Nuo</th><th>Iki</th><th>Laikas (min)</th></tr>${tableRows}</table></div>`;
					}

					container.innerHTML += section + '<hr style="margin: 20px 0;">';
				}
			});

		document.getElementById('saveBtn').addEventListener('click', () => {
			document.querySelectorAll('#schedules input[data-prop]').forEach(input => {
				const user = input.dataset.user;
				const prop = input.dataset.prop;
				globalData[user][prop] = input.value;
			});

			document.querySelectorAll('#schedules input[data-field]').forEach(input => {
				const user = input.dataset.user;
				const day = input.dataset.day;
				const field = input.dataset.field;
				let val = input.value;

				if ((field === 'start' || field === 'end') && val && val.length === 5) {
					val += ':00';
				} else if (field === 'time') {
					val = parseInt(val) || 0;
				}

				globalData[user][day][field] = val;
			});

			fetch('/admin/config', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(globalData)
			})
				.then(response => {
					if (response.ok) {
						alert('Saved!');
					} else {
						alert('Failed to save configuration.');
					}
				})
				.catch(err => alert('Error: ' + err));
		});
	</script>
</body>
</html>
